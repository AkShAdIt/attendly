<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="attendlyGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB" />
      <stop offset="1" stop-color="#4F46E5" />
    </linearGradient>
    <filter id="shadow" x="0" y="20" width="512" height="512" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#1E40AF" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <!-- App Background Tile -->
  <rect width="512" height="512" rx="128" fill="url(#attendlyGrad)" />
  
  <!-- Subtle Inner Border -->
  <rect x="8" y="8" width="496" height="496" rx="120" stroke="white" stroke-opacity="0.15" stroke-width="8" />
  
  <!-- Checkmark Graphic -->
  <g filter="url(#shadow)">
    <!-- First Check (Left) -->
    <path d="M120 270 L200 350 L392 158" stroke="white" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Second Accent Check (Overlap) -->
    <path d="M192 270 L256 334 L336 254" stroke="#93C5FD" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
  </g>
</svg>
